# 生产漂移巡检：定时比对「生产实际运行版本/规则 hash」与「main HEAD」。
# 覆盖历史事故场景：
#   - CI 单测失败阻断 deploy（49201f9b 针盒 FOLD 修复在 main 上但生产未更新，无人察觉）
#   - 部署中途失败/部分部署（89bc9893）
#   - 规则 manifest 已提交但生产 reconcile 失败或漂移（6652c4be extraCount NULL）
# 失败时 GitHub 会向仓库 watcher 发送 Actions 失败通知邮件（无需额外 webhook）。
name: Prod Drift Watchdog

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

# 巡检只读，允许多实例但无意义，串行即可
concurrency:
  group: prod-drift-watchdog
  cancel-in-progress: false

env:
  PROD_PORT: ${{ vars.PROD_PORT || '8853' }}
  # main HEAD 提交年龄在此宽限分钟内时，允许生产停留在前一个提交（部署在途）
  GRACE_MINUTES: 30

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # 需要完整历史：生产可能落后多个提交，merge-base/rev-list 依赖祖先链
          fetch-depth: 0

      # 2026-09-05 晚起，生产宿主机对 GitHub runner（Azure 境外 IP）的入站连接出现干扰：
      # 8853 直连被挂起约 30s 后返回 {"code":500}（HTTP 200 包装业务错误，curl -f 无法识别），
      # SSH 22 在密钥交换阶段被 RST（同期 deploy.yml 亦因此失败）。故按
      # SSH 回环 → 公网 nginx(8854) → 公网直连(8853) 顺序探测，任一通路返回合法版本 JSON 即采纳，
      # 并输出各通路诊断信息，便于定位宿主机侧封禁。
      - name: Fetch prod version
        id: prod
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          PROD_HOST: ${{ vars.PROD_HOST || '39.102.213.51' }}
          PROD_HTTP_PORT: ${{ vars.PROD_HTTP_PORT || '8854' }}
        run: |
          set -e
          BODY=""

          extract_sha () {
            printf '%s' "$1" | jq -r '.data.gitSha // ""' 2>/dev/null || true
          }

          try_adopt () {
            if [ -n "$(extract_sha "$2")" ]; then
              BODY="$2"
              echo "==> 通路「$1」获取生产版本成功"
              return 0
            fi
            return 1
          }

          # 通路 A：SSH 到服务器本机回环口（与 deploy.yml 版本 parity 闸门同路径）
          if [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_KEY:-}" ]; then
            PORT="${SSH_PORT:-22}"
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_KEY" > ~/.ssh/prod_drift_key
            chmod 600 ~/.ssh/prod_drift_key
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            for attempt in 1 2; do
              OUT="$(ssh -i ~/.ssh/prod_drift_key -o StrictHostKeyChecking=no -o ConnectTimeout=10 -p "$PORT" "$SSH_USER@$SSH_HOST" "curl -sS --connect-timeout 5 --max-time 15 http://127.0.0.1:${PROD_PORT}/api/v1/base/version" 2>&1)" || true
              if try_adopt "SSH 回环" "$OUT"; then
                break
              fi
              echo "::warning::通路 A（SSH 回环）第 ${attempt} 次失败: $(printf '%s' "$OUT" | head -c 200)"
              sleep 3
            done
          else
            echo "::warning::SSH secrets 未配置，跳过通路 A"
          fi

          # 通路 B：公网 8854（前端 nginx 同源反代 backend）
          if [ -z "$(extract_sha "$BODY")" ]; then
            OUT="$(curl -sS --connect-timeout 8 --max-time 45 "http://${PROD_HOST}:${PROD_HTTP_PORT}/api/v1/base/version" 2>&1)" || true
            if ! try_adopt "公网 ${PROD_HTTP_PORT} nginx" "$OUT"; then
              echo "::warning::通路 B（公网 ${PROD_HTTP_PORT}）失败: $(printf '%s' "$OUT" | head -c 200)"
            fi
          fi

          # 通路 C：公网 8853 直连 backend（历史默认路径）
          if [ -z "$(extract_sha "$BODY")" ]; then
            OUT="$(curl -sS --connect-timeout 8 --max-time 45 "http://${PROD_HOST}:${PROD_PORT}/api/v1/base/version" 2>&1)" || true
            if ! try_adopt "公网 ${PROD_PORT} 直连" "$OUT"; then
              echo "::warning::通路 C（公网 ${PROD_PORT}）失败: $(printf '%s' "$OUT" | head -c 200)"
            fi
          fi

          echo "$BODY"
          GIT_SHA="$(extract_sha "$BODY")"
          if [ -z "$GIT_SHA" ]; then
            echo "::error::无法获取生产版本：SSH 回环 / 公网 ${PROD_HTTP_PORT} / 公网 ${PROD_PORT} 三条通路均失败——疑为宿主机对 GitHub runner IP 的入站干扰（安全组/云防火墙/fail2ban），请登录服务器核查"
            exit 1
          fi

          echo "$BODY" > /tmp/prod_version.json
          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "rules_hash=$(jq -r '.data.rulesManifestHash // ""' /tmp/prod_version.json)" >> "$GITHUB_OUTPUT"
          echo "reconcile_status=$(jq -r '.data.rulesReconcileStatus // ""' /tmp/prod_version.json)" >> "$GITHUB_OUTPUT"
          echo "reconciled_at=$(jq -r '.data.rulesReconciledAt // ""' /tmp/prod_version.json)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(jq -r '.data.buildTime // ""' /tmp/prod_version.json)" >> "$GITHUB_OUTPUT"

      - name: Check version drift vs main HEAD
        run: |
          set -e
          MAIN_SHA="$(git rev-parse HEAD)"
          PROD_SHA="${{ steps.prod.outputs.git_sha }}"
          echo "main HEAD: $MAIN_SHA"
          echo "prod     : $PROD_SHA"

          if [ -z "$PROD_SHA" ]; then
            echo "::error::生产 gitSha 为空——版本接口异常或响应结构变更，请检查 Fetch prod version 步骤日志"
            exit 1
          fi

          if [ "$PROD_SHA" = "$MAIN_SHA" ]; then
            echo "OK: 生产版本与 main HEAD 一致"
            exit 0
          fi

          MAIN_AGE_MIN=$(( ($(date +%s) - $(git log -1 --format=%ct HEAD)) / 60 ))
          echo "main HEAD 提交年龄: ${MAIN_AGE_MIN} 分钟（宽限 ${GRACE_MINUTES}）"
          if [ "$MAIN_AGE_MIN" -lt "$GRACE_MINUTES" ]; then
            PREV_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
            if [ -n "$PREV_SHA" ] && [ "$PROD_SHA" = "$PREV_SHA" ]; then
              echo "OK: main 刚更新（部署在途宽限内），生产为前一提交 $PREV_SHA"
              exit 0
            fi
          fi

          if ! git merge-base --is-ancestor "$PROD_SHA" HEAD 2>/dev/null; then
            echo "::error::生产版本 $PROD_SHA 不是 main 的祖先（生产跑了未合并/已回滚的代码）"
            exit 1
          fi
          BEHIND="$(git rev-list --count "$PROD_SHA"..HEAD 2>/dev/null || echo '?')"
          echo "::error::生产落后 main ${BEHIND} 个提交（prod=$PROD_SHA main=$MAIN_SHA）——部署缺失或被阻断，请检查最近 Actions 运行"
          exit 1

      - name: Check rules manifest drift
        run: |
          set -e
          PROD_RULES="${{ steps.prod.outputs.rules_hash }}"
          REPO_RULES="$(jq -r '.manifest_hash // ""' backend/src/main/resources/billing-seeds/billing-rules-manifest.json)"
          echo "repo manifest : $REPO_RULES"
          echo "prod manifest : $PROD_RULES"
          if [ -z "$REPO_RULES" ]; then
            echo "::warning::仓库 manifest 无 manifest_hash 字段"
            exit 0
          fi
          if [ "$PROD_RULES" != "$REPO_RULES" ]; then
            echo "::error::生产规则 manifest hash 与 main 不一致——reconcile 失败或部署缺失"
            exit 1
          fi
          echo "OK: 规则 manifest hash 一致"

      - name: Check reconcile status marker
        run: |
          STATUS="${{ steps.prod.outputs.reconcile_status }}"
          if [ -z "$STATUS" ]; then
            echo " reconcile 状态字段不存在（旧版后端），以 hash 对版为准"
            exit 0
          fi
          echo "reconcile status: $STATUS"
          case "$STATUS" in
            OK*) echo "OK: reconcile 状态正常" ;;
            *) echo "::error::生产 manifest reconcile 状态异常: $STATUS"; exit 1 ;;
          esac
