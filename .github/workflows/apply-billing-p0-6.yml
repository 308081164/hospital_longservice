# 手动触发：在生产服务器重新应用 P0.6 billing 开关（24 院启用，billingEnabled=false 院除外）
name: Apply Billing P0.6 on Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/sql/p0-6-billing-toggle.sql
      - deploy/reapply-billing-p0-6-on-server.sh
      - deploy/apply-p0-6-billing-sql.sh
      - deploy/mysql-hospital-cli.sh
      - deploy/verify-billing-on-server.sh
      - deploy/verify-billing-api-on-server.sh
      - .github/workflows/apply-billing-p0-6.yml
      - .github/workflows/deploy.yml

concurrency:
  group: apply-billing-p0-6
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync deploy assets to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/mnt/newdisk/app/Hospital' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          DPATH="${DEPLOY_PATH:-/mnt/newdisk/app/Hospital}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p "$PORT" \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${DPATH}/deploy/sql' '${DPATH}/deploy'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -P "$PORT" \
            deploy/verify-billing-on-server.sh \
            deploy/reapply-billing-p0-6-on-server.sh \
            deploy/apply-p0-6-billing-sql.sh \
            deploy/mysql-hospital-cli.sh \
            deploy/verify-billing-api-on-server.sh \
            "${SSH_USER}@${SSH_HOST}:${DPATH}/deploy/"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -P "$PORT" \
            deploy/sql/p0-6-billing-toggle.sql \
            "${SSH_USER}@${SSH_HOST}:${DPATH}/deploy/sql/"

      - name: Reapply P0.6 and verify
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            DPATH="${{ secrets.DEPLOY_PATH || '/mnt/newdisk/app/Hospital' }}"
            cd "$DPATH"
            chmod +x deploy/verify-billing-on-server.sh deploy/reapply-billing-p0-6-on-server.sh \
              deploy/apply-p0-6-billing-sql.sh deploy/mysql-hospital-cli.sh \
              deploy/verify-billing-api-on-server.sh
            bash deploy/reapply-billing-p0-6-on-server.sh
