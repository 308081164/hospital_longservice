name: Prod Diagnose (one-off)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query prod override state and logs
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            DPATH="${{ secrets.DEPLOY_PATH || '/mnt/newdisk/app/Hospital' }}"
            cd "$DPATH"
            DBNAME="${MYSQL_DATABASE:-hospital}"
            set -a; source .env; set +a
            echo "== A. ZYY-D1 override =="
            docker exec hospital-mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT code, IF(standard_pricing_override IS NULL,'NULL','SET') FROM $DBNAME.customer WHERE code IN ('ZYY-D1','HRB-2ND');" 2>/dev/null || true
            echo "== B. not-null count in whole customer table =="
            docker exec hospital-mysql mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM $DBNAME.customer WHERE standard_pricing_override IS NOT NULL;" 2>/dev/null || true
            echo "== C. billing env of backend container =="
            docker inspect hospital-backend --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -i billing || echo "(no billing env)"
            echo "== D. baseline sync log lines =="
            docker logs hospital-backend 2>&1 | grep -iE "Baseline billing_enabled|同步失败|baseline sync|Baseline hash" | tail -20 || echo "(no match)"
            echo "== E. deploy .env billing flags =="
            grep -iE "BILLING_" .env || echo "(no BILLING_ keys in .env)"
