name: Prod Diagnose (one-off)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query prod override state and logs
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            DPATH="${{ secrets.DEPLOY_PATH || '/mnt/newdisk/app/Hospital' }}"
            cd "$DPATH"
            DBNAME="${MYSQL_DATABASE:-hospital}"
            set -a; source .env; set +a
            echo "== 0. host health =="
            date; uptime; df -h / /mnt 2>/dev/null | head -6; df -i / | tail -2; free -m | head -3
            echo "== 0b. containers =="
            docker ps -a --format '{{.Names}}	{{.Status}}	{{.Image}}' | head -12
            echo "== 0c. backend recent errors =="
            docker logs hospital-backend --since 12h 2>&1 | grep -aE "ERROR|Exception|OutOfMemory|No space left|Connection refused|Too many connections|Deadlock" | tail -25 || echo "(no error lines)"
            echo "== 0d. backend last 15 log lines =="
            docker logs hospital-backend --tail 15 2>&1 | tail -15 || true
            echo "== 0e. mysql processlist / uptime =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT VERSION(); SHOW GLOBAL STATUS LIKE 'Threads_connected'; SHOW GLOBAL STATUS LIKE 'Uptime';" 2>/dev/null || echo "(mysql unreachable)"
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SHOW PROCESSLIST;" 2>/dev/null | head -12 || true
            echo "== 0g. top / io =="
            top -bn1 | head -14 || true
            (iostat -x 1 2 2>/dev/null | tail -20) || echo "(no iostat)"
            cat /proc/pressure/io 2>/dev/null || true
            echo "== 0i. zombies by parent =="
            ps -eo stat,ppid,comm | awk '$1 ~ /^Z/ {print $2}' | sort | uniq -c | sort -rn | head -8 || true
            ps -eo stat,ppid,comm | awk '$1 ~ /^Z/' | wc -l || true
            for p in $(ps -eo stat,ppid | awk '$1 ~ /^Z/ {print $2}' | sort | uniq -c | sort -rn | head -3 | awk '{print $2}'); do echo "-- parent $p:"; ps -o pid,ppid,stat,etime,cmd -p $p 2>/dev/null | tail -2; done
            echo "== 0i2. which container owns 3963 =="
            for c in $(docker ps --format '{{.Names}}'); do p=$(docker inspect -f '{{.State.Pid}}' "$c" 2>/dev/null); [ "$p" = "3963" ] && echo "OWNER=$c"; done
            docker inspect -f '{{.Name}} restart={{.HostConfig.RestartPolicy.Name}} started={{.State.StartedAt}}' $(docker ps -q) 2>/dev/null | head -12
            echo "== 0i3. zombie growth (10s) =="
            a=$(ps -eo stat | awk '$1 ~ /^Z/' | wc -l); sleep 10; b=$(ps -eo stat | awk '$1 ~ /^Z/' | wc -l); echo "zombies $a -> $b"
            echo "== 0j. pid pressure =="
            cat /proc/sys/kernel/pid_max; ps -e | wc -l
            echo "== 0h. innodb trx =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT trx_id, trx_state, trx_started, TIMESTAMPDIFF(SECOND,trx_started,NOW()) secs, trx_mysql_thread_id, LEFT(trx_query,120) q FROM information_schema.innodb_trx ORDER BY secs DESC LIMIT 10;" 2>/dev/null || true
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SHOW ENGINE INNODB STATUS\G" 2>/dev/null | grep -aE "Pending|History list|Log sequence|fsync|spin|TRANSACTIONS|Trx id|ACTIVE" | head -20 || true
            echo "== 0f. recent reconciliation jobs =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT id, hospital_name, total_rows, review_status, created_at FROM $DBNAME.hospital_reconciliation_job ORDER BY id DESC LIMIT 6;" 2>/dev/null || true
            echo "== A. ZYY-D1 override =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT code, IF(standard_pricing_override IS NULL,'NULL','SET') FROM $DBNAME.customer WHERE code IN ('ZYY-D1','HRB-2ND');" 2>/dev/null || true
            echo "== B. not-null count in whole customer table =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM $DBNAME.customer WHERE standard_pricing_override IS NOT NULL;" 2>/dev/null || true
            echo "== C. billing env of backend container =="
            docker inspect hospital-backend --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -i billing || echo "(no billing env)"
            echo "== D. baseline sync log lines =="
            docker logs hospital-backend 2>&1 | grep -iE "Baseline billing_enabled|同步失败|baseline sync|Baseline hash" | tail -20 || echo "(no match)"
            echo "== E. deploy .env billing flags =="
            grep -iE "BILLING_" .env || echo "(no BILLING_ keys in .env)"
            echo "== F. unit_price column + HRB-2ND 内热针 rows =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='$DBNAME' AND TABLE_NAME='customer_product_rule' AND COLUMN_NAME='unit_price';" 2>/dev/null || true
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT r.name, r.price, r.unit_price, r.is_active, r.min_instrument_count, r.max_instrument_count FROM $DBNAME.customer_product_rule r JOIN $DBNAME.customer c ON c.id=r.customer_id WHERE c.code='HRB-2ND' AND r.name LIKE '%内热针%';" 2>/dev/null || true
            echo "== F2. ASCII-only: HRB-2ND fold rules with unit_price =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM $DBNAME.customer_product_rule r JOIN $DBNAME.customer c ON c.id=r.customer_id WHERE c.code='HRB-2ND' AND r.rule_type='FOLD' AND r.unit_price IS NOT NULL;" 2>/dev/null || true
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT r.priority, r.fold_ratio, r.unit_price, r.min_instrument_count, r.max_instrument_count, r.skip_packaging FROM $DBNAME.customer_product_rule r JOIN $DBNAME.customer c ON c.id=r.customer_id WHERE c.code='HRB-2ND' AND r.unit_price IS NOT NULL ORDER BY r.priority;" 2>/dev/null || true
            echo "== H. fold_offset column + 骨伤钢针 rows =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='$DBNAME' AND TABLE_NAME='customer_product_rule' AND COLUMN_NAME='fold_offset';" 2>/dev/null || true
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT r.priority, r.rule_type, r.fold_ratio, r.fold_offset, r.unit_price, r.fee, r.is_active FROM $DBNAME.customer_product_rule r JOIN $DBNAME.customer c ON c.id=r.customer_id WHERE c.code='HRB-GUSHANG' AND r.fold_offset IS NOT NULL ORDER BY r.priority;" 2>/dev/null || true
            echo "== I. ZYY-D1 billing policies（附一折扣策略）=="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT p.priority, p.policy_type, p.name, p.is_active FROM $DBNAME.customer_billing_policy p JOIN $DBNAME.customer c ON c.id=p.customer_id WHERE c.code='ZYY-D1' ORDER BY p.priority;" 2>/dev/null || true
            echo "== I2. ＜3件档 rate 与 无纺布是否纳入八折 =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT name, params FROM $DBNAME.customer_billing_policy p JOIN $DBNAME.customer c ON c.id=p.customer_id WHERE c.code='ZYY-D1' AND p.name='附一＜3件标准价八折';" 2>/dev/null || true
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT name, scope FROM $DBNAME.customer_billing_policy p JOIN $DBNAME.customer c ON c.id=p.customer_id WHERE c.code='ZYY-D1' AND p.name='附一对账八折';" 2>/dev/null || true
            echo "== G. baseline hash marker vs classpath =="
            docker exec hospital-mysql mysql --default-character-set=utf8mb4 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "SELECT setting_key, LEFT(setting_value,20) FROM $DBNAME.sys_setting WHERE setting_key LIKE '%baseline%' OR setting_key LIKE '%manifest%';" 2>/dev/null || true
            echo "== Z. DISK (P0 2026-11-01) =="
            date; uptime
            df -h | head -15
            echo "-- docker root --"
            droot=$(docker info -f "{{.DockerRootDir}}" 2>/dev/null || echo /var/lib/docker)
            echo "root=$droot"
            df -h "$droot" 2>/dev/null | tail -2
            df -i "$droot" 2>/dev/null | tail -2
            echo "-- biggest under docker root --"
            du -sh "$droot"/* 2>/dev/null | sort -h | tail -8 || true
            echo "-- deploy path biggest --"
            du -sh "$DPATH"/* 2>/dev/null | sort -h | tail -8 || true
            echo "-- mysql mounts --"
            docker inspect hospital-mysql -f "{{range .Mounts}}{{.Source}} -> {{.Destination}}{{println}}{{end}}" 2>/dev/null || true
            echo "-- containers --"
            docker ps -a --format "{{.Names}}	{{.Status}}" | head -10
