# 宿主机 Nginx 反向代理示例（可选）。
# 若使用 docker-compose 映射 HTTP_PORT，通常无需此文件。
# 未来 CI 可将本文件复制到 /etc/nginx/conf.d/ 或宝塔 vhost 目录。
#
# 使用前替换 server_name 与 upstream 端口（与 .env 中 HTTP_PORT 一致，默认 1001）。

client_max_body_size 100M;

upstream hospital_frontend {
    server 127.0.0.1:8854;
}

server {
    listen 80;
    server_name hospital.example.com;

    location / {
        proxy_pass http://hospital_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
