spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_backend?rewriteBatchedStatements=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
#    password: ${MYSQL_PASSWORD:1234}
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    # 开发环境 JWT 密钥（仅本地使用，Docker 部署时由环境变量 APP_JWT_SECRET 覆盖）
    secret: dev-jwt-secret-key-for-local-development-only
  upload:
    dir: ./uploads/hospital-reconciliations
  storage:
    dir: ./storage/hospital-reconciliations
  template:
    # 模板文件路径（存在则使用模板操作，否则降级为简单导出）
    bill: 测试表格/账单_标准模板.xlsx
    settlement: 测试表格/结款函.xlsx

logging:
  level:
    com.hospital: DEBUG
    org.springframework.security: DEBUG
