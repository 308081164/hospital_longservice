server {
    listen       80;
    server_name  localhost;

    charset utf-8;

    # 允许上传大文件（与后端 spring.servlet.multipart.max-file-size 保持一致）
    client_max_body_size 60m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 静态资源（带 hash，长期缓存）
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（大医院账单导入可达数万行，需与前端 import timeout 10min 对齐）
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # SPA 路由：所有非文件请求回退到 index.html
    # index.html 禁止缓存，确保部署后用户获取最新版本
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端版本指纹：禁止缓存，供运行中的旧 bundle 轮询检测新部署
    location = /version.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
        # SPA 回退到 index.html 时也禁止缓存，避免部署后仍命中旧 HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
