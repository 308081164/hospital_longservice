# 生产环境：仅拉取预构建镜像，不在服务器上 build。
# 使用前在服务器 .env 中设置：
#   IMAGE_BACKEND=ghcr.io/<owner>/hospital-backend:latest
#   IMAGE_FRONTEND=ghcr.io/<owner>/hospital-frontend:latest
#
# ========== 网络说明（当前生产服务器）==========
# 部分 ECS 上 Docker 网桥容器互访失败（No route to host）。
# backend 与 frontend 均使用 network_mode: service:mysql，共享 mysql 网络栈：
#   - backend → 127.0.0.1:3306（MySQL）
#   - frontend nginx → 127.0.0.1:8000（API）
# 对外端口映射在 mysql 服务：8853→8000，8854→80
# .env：MYSQL_HOST=127.0.0.1  MYSQL_PORT=3306
#
# 典型生产命令：
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml up -d --pull never mysql
#   docker compose -f docker-compose.prod.yml up -d --no-deps backend
#   docker compose -f docker-compose.prod.yml up -d --no-deps frontend

name: hospital-reconciliation

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: hospital-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospital}
      MYSQL_USER: ${MYSQL_USER:-hospital}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${BACKEND_PUBLISH_PORT:-8853}:8000"
      - "${HTTP_PORT:-8854}:80"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/please-set/hospital-backend:latest}
    container_name: hospital-backend
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: "service:mysql"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: ${MYSQL_HOST:-127.0.0.1}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospital}
      MYSQL_USER: ${MYSQL_USER:-hospital}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_COMPANY_BANK_ACCOUNT: ${APP_COMPANY_BANK_ACCOUNT:-}
      APP_COMPANY_BANK_NAME: ${APP_COMPANY_BANK_NAME:-}
      TZ: Asia/Shanghai
    volumes:
      - backend-uploads:/app/uploads
      - backend-storage:/app/storage
      - ./backend/src/main/resources/db:/app/db:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/base/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    logging: *default-logging

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/please-set/hospital-frontend:latest}
    container_name: hospital-frontend
    restart: unless-stopped
    network_mode: "service:mysql"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./deploy/nginx-frontend-shared-net.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

volumes:
  mysql-data:
  backend-uploads:
  backend-storage:
